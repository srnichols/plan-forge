name: Validate Setup
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-powershell:
    name: Validate (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run setup wizard (dotnet preset, non-interactive)
        shell: pwsh
        run: |
          $testDir = "$env:RUNNER_TEMP\test-project"
          New-Item -ItemType Directory -Path $testDir -Force
          .\setup.ps1 -Preset dotnet -ProjectPath $testDir -ProjectName "TestProject" -Force

      - name: Run validation
        shell: pwsh
        run: |
          $testDir = "$env:RUNNER_TEMP\test-project"
          .\validate-setup.ps1 -ProjectPath $testDir

  validate-windows-powershell:
    name: Validate (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The other PowerShell jobs run pwsh (PowerShell 7). The PowerShell that ships with Windows is 5.1, and
      # setup.ps1 has to install under it too: it once failed to parse there, and then wrote the system code
      # page into the files it generated (#417).
      - name: Run setup wizard in Windows PowerShell 5.1 (custom preset, every agent)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          $testDir = "$env:RUNNER_TEMP\test-ps51"
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          .\setup.ps1 -Preset custom -Agent all -ProjectPath $testDir -ProjectName "Test" -Force
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Run validation in Windows PowerShell 5.1
        shell: powershell
        run: .\validate-setup.ps1 -ProjectPath "$env:RUNNER_TEMP\test-ps51"

      - name: Check the installed text is UTF-8, with its dashes and arrows
        shell: pwsh
        run: node scripts/check-installed-text.mjs "$env:RUNNER_TEMP\test-ps51"

      # Parsing is what failed for setup.ps1 (#417) and four maintainer scripts: a file with no byte order mark is
      # read in the system code page, and an em dash in a string ended it. The vitest job runs on Linux, where
      # Windows PowerShell does not exist, so this is the one place every script is parsed by 5.1.
      - name: Parse every PowerShell script in Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($path in (git ls-files '*.ps1' '*.psm1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $bad++; Write-Host "::error file=$path,line=$($errors[0].Extent.StartLineNumber)::$($errors[0].Message)" }
          }
          if ($bad) { exit 1 }
          Write-Host "every script parses"

  validate-bash:
    name: Validate (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run setup wizard (typescript preset, non-interactive)
        run: |
          TEST_DIR="$RUNNER_TEMP/test-project"
          mkdir -p "$TEST_DIR"
          chmod +x setup.sh
          ./setup.sh --preset typescript --path "$TEST_DIR" --name "TestProject" --force

      - name: Run validation
        run: |
          TEST_DIR="$RUNNER_TEMP/test-project"
          chmod +x validate-setup.sh
          ./validate-setup.sh --path "$TEST_DIR"

  # macOS ships Bash 3.2 and BSD userland. Nothing ran the installers there, so what a Mac user gets was a guess.
  # Each leg runs the scripts the way a user would: the system Bash with the stock PATH, Homebrew's Bash first
  # on PATH, and PowerShell 7. Every preset step runs even when an earlier one failed, so one run says everything.
  validate-macos:
    name: Validate (macOS, ${{ matrix.shell }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [system-bash, homebrew-bash, pwsh]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: The shells and tools on this runner
        run: |
          sw_vers
          echo "/bin/bash: $(/bin/bash --version | head -1)"
          echo "bash on PATH: $(command -v bash): $(bash --version | head -1)"
          command -v pwsh && pwsh --version || echo "no pwsh on PATH"
          ls -d /opt/homebrew/bin/bash /usr/local/bin/bash 2>/dev/null || echo "no Homebrew bash installed"
          echo "sort -V puts 1.9 first: $(printf '1.10\n1.9\n' | sort -V | head -1)"
          if echo x | grep -P x >/dev/null 2>&1; then echo "grep -P: yes"; else echo "grep -P: no"; fi
          echo "stat -c: $(stat -c %Y . 2>&1 | head -1)"
          echo "sed replacement with \\n: $(echo a | sed 's/a/b\nc/')"
          awk --version 2>&1 | head -1 || true

      - name: Setup, validate and update with Bash
        if: matrix.shell != 'pwsh'
        run: |
          if [ "${{ matrix.shell }}" = homebrew-bash ]; then
            brew list bash >/dev/null 2>&1 || brew install bash
            export PATH="$(brew --prefix)/bin:$PATH"
          else
            # The stock PATH, as a Mac user has it: /bin/bash is 3.2 and the tools are BSD.
            export PATH="$(dirname "$(command -v node)"):/usr/bin:/bin:/usr/sbin:/sbin"
          fi
          echo "bash: $(command -v bash): $(bash --version | head -1)"
          chmod +x setup.sh validate-setup.sh
          rc=0
          # custom, a stack preset, a stack preset with every agent adapter, and a list of adapters
          for run in custom:copilot typescript:copilot typescript:all custom:claude,cursor,codex; do
            preset="${run%%:*}"; agent="${run##*:}"
            echo "::group::setup.sh --preset $preset --agent $agent"
            dir="$RUNNER_TEMP/test-macos-$preset-$agent"; mkdir -p "$dir"
            if ./setup.sh --preset "$preset" --agent "$agent" --path "$dir" --name Test --force; then
              ./validate-setup.sh --path "$dir" || { echo "::error::validate-setup.sh failed for $preset $agent"; rc=1; }
            else
              echo "::error::setup.sh --preset $preset --agent $agent failed"; rc=1
            fi
            echo "::endgroup::"
          done

          # setup.sh read each description with grep -P, which BSD grep lacks, and the failure was hidden: the generated
          # files carried their fallback text. They must carry the real one.
          all="$RUNNER_TEMP/test-macos-typescript-all"
          grep -q "^description: Pipeline Step 1" "$all/.claude/skills/planforge-step1-preflight-check/SKILL.md" || { echo "::error::a generated Claude skill has not got its description"; rc=1; }
          grep -q '^description = "Pipeline Step 1' "$all/.gemini/commands/planforge/step1-preflight-check.toml" || { echo "::error::a generated Gemini command has not got its description"; rc=1; }

          # What a Mac user does next: look at the project, then update it. A guidance file is deleted and another
          # edited first, so the update has a new file to add and an edited one to keep.
          echo "::group::pforge.sh in the installed project"
          cd "$RUNNER_TEMP/test-macos-typescript-copilot"
          chmod +x pforge.sh
          git init -q . && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm install
          ./pforge.sh --help >/dev/null || { echo "::error::pforge.sh --help failed"; rc=1; }
          ./pforge.sh check || { echo "::error::pforge.sh check failed"; rc=1; }
          rm .github/instructions/security.instructions.md
          echo "<!-- edited here -->" >> .github/instructions/testing.instructions.md
          ./pforge.sh update "$GITHUB_WORKSPACE" --force --yes --allow-dev || { echo "::error::pforge.sh update failed"; rc=1; }
          [ -f .github/instructions/security.instructions.md ] || { echo "::error::update did not restore the deleted file"; rc=1; }
          grep -q "edited here" .github/instructions/testing.instructions.md || { echo "::error::update overwrote an edited file"; rc=1; }
          [ -f .forge/update-pending/.github/instructions/testing.instructions.md ] || { echo "::error::update did not keep the new version of the edited file"; rc=1; }
          grep -q "plan-forge managed" .gitignore || { echo "::error::update left no managed block in .gitignore"; rc=1; }
          ./pforge.sh new-phase "Mac Phase" || { echo "::error::pforge.sh new-phase failed"; rc=1; }
          grep -q "### Phase 1: Mac Phase" docs/plans/DEPLOYMENT-ROADMAP.md || { echo "::error::new-phase did not add the phase to the roadmap"; rc=1; }
          echo "::endgroup::"
          exit $rc

      - name: Setup and validate with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $rc = 0
          foreach ($preset in 'custom', 'typescript') {
            Write-Host "::group::setup.ps1 -Preset $preset"
            $dir = Join-Path $env:RUNNER_TEMP "test-macos-$preset"
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            ./setup.ps1 -Preset $preset -ProjectPath $dir -ProjectName Test -Force
            if ($LASTEXITCODE) { Write-Host "::error::setup.ps1 -Preset $preset failed"; $rc = 1 }
            else {
              ./validate-setup.ps1 -ProjectPath $dir
              if ($LASTEXITCODE) { Write-Host "::error::validate-setup.ps1 failed for $preset"; $rc = 1 }
              # PowerShell here hides a name that starts with a dot, and the runtime packages ship some (#427). Every tracked
              # file of them has to be in the project; an update would list the others as new.
              $missing = @(git ls-files pforge-mcp pforge-master pforge-sdk | Where-Object { "/$_/" -notmatch '/(node_modules|\.forge|coverage)/' } | Where-Object { -not (Test-Path -LiteralPath (Join-Path $dir $_)) })
              if ($missing.Count -gt 0) { Write-Host "::error::setup.ps1 -Preset $preset did not copy $($missing.Count) files of the runtime packages, $($missing[0]) for one"; $rc = 1 }
            }
            Write-Host "::endgroup::"
          }
          exit $rc

  validate-all-presets:
    name: Validate All Presets (Bash)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [dotnet, typescript, python, java, go, swift, rust, php, azure-iac, custom]
    steps:
      - uses: actions/checkout@v7

      - name: Run setup (${{ matrix.preset }})
        run: |
          TEST_DIR="$RUNNER_TEMP/test-${{ matrix.preset }}"
          mkdir -p "$TEST_DIR"
          chmod +x setup.sh
          ./setup.sh --preset ${{ matrix.preset }} --path "$TEST_DIR" --name "Test" --force

      - name: Validate (${{ matrix.preset }})
        run: |
          TEST_DIR="$RUNNER_TEMP/test-${{ matrix.preset }}"
          chmod +x validate-setup.sh
          ./validate-setup.sh --path "$TEST_DIR"

  validate-all-presets-powershell:
    name: Validate All Presets (PowerShell)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [dotnet, typescript, python, java, go, swift, rust, php, azure-iac, custom]
    steps:
      - uses: actions/checkout@v7

      - name: Run setup (${{ matrix.preset }})
        shell: pwsh
        run: |
          $testDir = "$env:RUNNER_TEMP\test-${{ matrix.preset }}"
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          .\setup.ps1 -Preset ${{ matrix.preset }} -ProjectPath $testDir -ProjectName "Test" -Force
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Validate (${{ matrix.preset }})
        shell: pwsh
        run: .\validate-setup.ps1 -ProjectPath "$env:RUNNER_TEMP\test-${{ matrix.preset }}"

  preset-quality:
    name: Preset quality (filler, copied blocks, wrong stack, skill steps, shell and PHP samples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check every preset
        # PHP samples use php on the runner, or Docker php:8.4-cli when it is missing.
        run: node scripts/audit/preset-quality.mjs --php

  pforge-mcp-tests:
    name: pforge-mcp vitest suite (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # The engines.node floor and the current LTS.
        node: ['22.12', '24']
    # v2.82.2 follow-up — historically `pforge-mcp/tests/` was not run in CI,
    # so 35+ baseline failures accumulated unnoticed. This job runs the full
    # vitest suite on every PR + push, fails the build if any new test breaks,
    # and tolerates the documented baseline failures (tracked in a GitHub
    # issue) until they're fixed bucket by bucket.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: pforge-mcp/package.json

      - name: Install dependencies
        working-directory: pforge-mcp
        run: npm install --no-audit --no-fund

      - name: Run vitest (full suite)
        working-directory: pforge-mcp
        # Hard-fail on any test failure. v2.82.2 set this at 35 to track the
        # baseline; the v2.82.2 follow-up cleanup pass drove it to 0 by:
        # - Bucket C: tools.json schema sync (4 tests)
        # - Bucket E: tempering scanner-count update for content-audit (1)
        # - Bucket F: cost-service-real-plans degrades to skip when no plans (1)
        # - Bucket D: runtime-quorum-viability opus-4.6 → opus-4.7 (3)
        # - Bucket B: forge-master test drift + skipPlanner DI hook (~26)
        # - Bucket A: advisory contract tests skipped pending product call (12 skips)
        # - Hammer-fm test archived to match script archival (1 file)
        # - Quorum-config-precedence: bumped timeout + Windows skip for 2 slow probes
        # If a NEW test fails, fix it — don't bump this number.
        #
        # Issue #155 (2026-05-06): The 10-baseline bump that PR #154 added
        # has been removed. The 9 "CI-only" failures had nothing to do with
        # COPILOT_GITHUB_TOKEN — they were version-string drift, schema drift
        # in tools.json (forge_tempering_drain / forge_triage_route metadata
        # vs the test contract), the github-introspect check-count being
        # bumped from 8 → 9 without updating the assertion, and a path-test
        # that hardcoded "C:\..." which Linux CI resolved as a relative
        # filename. All fixed inline. Ceiling stays at 0 — any new failure
        # is a real regression worth investigating.
        env:
          BASELINE_FAILURES: "0"
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=vitest-results.json 2>&1 | tail -200
          set -e
          NUM_FAILED="$(node -e "const r=require('./vitest-results.json'); console.log(r.numFailedTests || 0)")"
          NUM_PASSED="$(node -e "const r=require('./vitest-results.json'); console.log(r.numPassedTests || 0)")"
          echo ""
          echo "vitest result: $NUM_PASSED passed, $NUM_FAILED failed (baseline tolerance: $BASELINE_FAILURES)"
          if [ "$NUM_FAILED" -gt "$BASELINE_FAILURES" ]; then
            echo "::error::vitest failed $NUM_FAILED tests, exceeds baseline tolerance of $BASELINE_FAILURES."
            echo "::error::This means a NEW test regressed. Investigate the new failures, then either fix or update BASELINE_FAILURES in .github/workflows/validate.yml."
            exit 1
          fi
          echo "::notice::vitest within baseline tolerance ($NUM_FAILED <= $BASELINE_FAILURES)."

      - name: Upload vitest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-results-node${{ matrix.node }}
          path: pforge-mcp/vitest-results.json
          retention-days: 14
