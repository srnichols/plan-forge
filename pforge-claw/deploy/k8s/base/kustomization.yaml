apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pforge-claw
labels:
  - pairs:
      app: pforge-claw
    includeSelectors: false
    includeTemplates: false
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy-dispatcher.yaml
