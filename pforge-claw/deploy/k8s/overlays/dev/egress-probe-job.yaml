apiVersion: batch/v1
kind: Job
metadata:
  name: pforge-claw-egress-probe
spec:
  ttlSecondsAfterFinished: 30
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: pforge-claw-egress-probe
        app.kubernetes.io/part-of: pforge-claw
        pforge-claw/role: job
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: pforge-claw-worker-node:dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - node
            - --input-type=module
            - -e
            - "import { lookup } from 'node:dns/promises'; const allowed = await fetch('http://pforge-claw-dispatcher:3190/healthz', { signal: AbortSignal.timeout(5000) }); if (!allowed.ok) throw new Error('allowed dispatcher unavailable'); await lookup('pforge-claw-egress-target'); let denied = false; try { await fetch('http://pforge-claw-egress-target:3190/healthz', { signal: AbortSignal.timeout(5000) }); } catch { denied = true; } if (!denied) throw new Error('worker policy unexpectedly allowed the negative target'); console.log('worker policy allowed dispatcher and DNS; negative target denied');"
