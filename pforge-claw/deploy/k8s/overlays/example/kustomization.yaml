apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pforge-claw
resources:
  - ../../base
  - ingress.yaml
images:
  - name: pforge-claw-dispatcher
    newName: <registry>/<namespace>/pforge-claw-dispatcher
    newTag: <tag>
patches:
  - path: patch-deployment.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: pforge-claw-dispatcher
  - path: patch-pvc.yaml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: pforge-claw-data
configMapGenerator:
  - name: pforge-claw-config
    files:
      - config.json
