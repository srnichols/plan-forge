[project]
name = "preset-build-python-scaffold"
version = "0.1.0"
description = "Minimal app used to build/health-check the python preset's documented Dockerfile."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
