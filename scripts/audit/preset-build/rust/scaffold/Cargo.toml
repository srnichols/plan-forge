[package]
name = "preset-rust-build-check"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "preset-rust-build-check"
path = "src/main.rs"

[[bench]]
name = "performance_bench"
harness = false

[dependencies]
anyhow = "1"
argon2 = "0.5.3"
async-graphql = { version = "7.2.1", features = ["uuid", "dataloader"] }
async-graphql-axum = "7.2.1"
async-nats = "0.50.0"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros"] }
config = "0.15"
console-subscriber = "0.5.0"
deadpool-redis = "0.23"
dotenvy = "0.15"
futures-util = "0.3"
http = "1"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lapin = "4.12.0"
mockall = "0.15.0"
moka = { version = "0.12", features = ["future"] }
opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.33.0"
redis = { version = "1", features = ["tokio-comp"] }
reqwest = { version = "0.12", features = ["json"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7"
tower = "0.5.3"
tower_governor = "0.8"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "cors", "limit", "timeout", "set-header"] }
tracing = "0.1"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "time"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["serde", "v4"] }
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
